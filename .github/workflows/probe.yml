name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          uname -a
          if [ "$(uname)" = "Darwin" ]; then
            sw_vers
            ls /Applications | grep -i xcode
            xcodebuild -version
          fi
