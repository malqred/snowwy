name: iOS (.ipa)

# Собирает неподписанный Snowwy.ipa для установки через Sideloadly.
# Запуск: вкладка Actions → «iOS (.ipa)» → Run workflow. Только вручную: в приватном
# репозитории минута macOS стоит как десять обычных, а бесплатных минут 2000 в месяц.

on:
  workflow_dispatch:
    inputs:
      # macos-26 (arm64) быстрее, но на нём бывают долгие очереди
      runner:
        description: Образ macOS для сборки
        default: macos-26-intel

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ inputs.runner || 'macos-26-intel' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Expo SDK 58 требует Xcode 26.4 или новее — берём самый свежий из установленных
      - name: Выбрать Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Установить зависимости
        run: npm ci

      - name: Проверить алгоритм
        run: npm test

      - name: Сгенерировать проект Xcode
        run: npx expo prebuild --platform ios

      - name: Собрать приложение (без подписи)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Упаковать .ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          test -f "$APP/main.jsbundle" || { echo "В приложении нет JS-бандла"; exit 1; }
          # Номер сборки берётся из поля version в app.json: Snowwy-1.0.2.ipa
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "Snowwy-$VERSION.ipa" Payload
          ls -lh "Snowwy-$VERSION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Snowwy-${{ env.VERSION }}
          path: out/Snowwy-${{ env.VERSION }}.ipa
          retention-days: 30

      # Релиз нужен, чтобы .ipa скачивался одним файлом, без распаковки архива
      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          FILE="out/Snowwy-$VERSION.ipa"
          # Повторная сборка той же версии заменяет файл в уже существующем релизе
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Snowwy $VERSION" \
              --notes "Неподписанный .ipa для установки через iLoader или Sideloadly. Инструкция — в README." \
              --target "${{ github.sha }}"
          fi
